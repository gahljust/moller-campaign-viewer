<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLLER · Campaign analysis</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="brand">MOLLER <span>Campaign analysis</span></div></header>
<main><div id="analysisSelection" class="selection"><label>Target<select id="targetSelect"></select></label><label>Energy<select id="energySelect"></select></label><label>Interaction<select id="processSelect"></select></label><label>Sieve<select id="sieveSelect"></select></label><select id="run" aria-label="Saved campaign" hidden></select><span id="identity"></span></div>
<nav aria-label="Analysis views"><button data-tab="results">Results & uncertainties</button><button data-tab="maps" aria-selected="true">Hit maps & kinematics</button><button data-tab="transport">Particle transport</button></nav>
<div id="notice" role="status"></div>
<section id="results" class="view" hidden><div class="heading"><h1>Dilution factors</h1><button id="download">Download covariance & values</button></div><p id="resultScope"></p><div id="resultBody"></div>
</section>
<section id="maps" class="view"><div class="heading"><h1>Detector hit maps</h1></div>
<div class="controls"><label>Plane<select id="plane"><option value="circle">ShowerMax PE response</option></select></label><label>Detail<select id="tile"><option value="">Whole plane</option></select></label><label class="check"><input id="foldSectors" type="checkbox">Pool symmetric sectors</label></div>
<p id="mapScope" class="statusline"></p><div class="mapGrid"><article><h2 id="mapTitle">Raw simulation</h2><canvas id="rawMap" width="620" height="570"></canvas></article><article id="regionTable" aria-live="polite"></article></div><div id="mapDetails"></div>
</section>
<section id="transport" class="view" hidden><div class="heading"><h1>Particles through the apparatus</h1></div><p id="transportScope" class="statusline"></p><div id="transportNotice" role="status"></div>
<div class="controls transportControls"><label>Campaign<select id="trackRun"></select></label><label>View<select id="camera"><option value="side">Side</option><option value="orbit" selected>Oblique</option><option value="end">Along beam</option></select></label><label>Focus<select id="trackFocus"><option value="all" selected>Whole apparatus</option><option value="target">Target</option><option value="toroid/magnet">Magnets</option><option value="detectors">GEMs & detectors</option><option value="showermax">ShowerMax</option></select></label><label>Color<select id="trackColor"><option value="origin">Primary / secondary</option><option value="energy">Kinetic energy</option></select></label><button id="resetCamera">Reset view</button></div>
<div class="particleControls"><div id="particleMode" class="segmented" role="group" aria-label="Particles to show"><button data-mode="all" aria-pressed="true">All particles</button><button data-mode="primaries" aria-pressed="false">Primaries</button><button data-mode="secondaries" aria-pressed="false">Secondaries</button></div><label id="originControl" hidden>Created in<select id="trackOrigin"><option value="all">All components</option></select></label></div><div class="transportStage"><canvas tabindex="0" aria-label="Interactive particle transport. Drag to rotate, shift drag to pan, scroll to zoom. Arrow keys rotate; shift arrow keys pan." id="tracks" width="1200" height="550"></canvas><div class="stageCaption"><strong id="trackStageTitle">Secondary showers</strong></div><div class="ringInset"><strong id="insetTitle">Main detector · along beam</strong><canvas id="ringInset" width="240" height="240" aria-label="Main detector quartz rings in their actual GDML positions"></canvas><span id="ringCaption">All six quartz rings</span></div></div>
<div id="ringControls" class="ringControls" aria-label="Highlight a detector"></div><div class="playback"><button id="play">Play</button><button id="restart" aria-label="Restart particle stream">↶</button><span class="streamStatus">Continuous stream</span><label>Speed<select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div>
<div class="viewerHelp"><strong>Drag to rotate</strong><span>Shift + drag to move · scroll to zoom</span></div>
<div id="trackLegend" class="legend"></div><div id="geometryLegend" class="legend geometryLegend"></div>
<p id="animationSummary" class="animationSummary"></p></section>

</main><script src="assets/math.js"></script><script src="assets/stream.js"></script><script src="assets/app.js"></script></body></html>
